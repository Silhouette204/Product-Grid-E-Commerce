<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <title>Archived Orders - Computer Grid</title>
</head>
<body class="body-container font-poppins line-height-1.6 bg-zinc-950 text-zinc-100">

  <div id="nav-container"></div>

  <div class="main-layout">
    <div class="main-hero container-1 my-10 px-4 max-w-7xl mx-auto">
      <div class="mt-10 flex flex-col gap-3 lg:mt-0">
        <h1 class="text-3xl lg:text-5xl font-semibold text-secondary">Archived Records</h1>
        <p class="text-secondary/70 text-sm lg:text-base max-w-3xl">
          Review or clean up your historic entries. Stored securely under backup partition arrays.
        </p>
      </div>

      <div class="mt-10 mb-5 flex items-center justify-between border-b border-zinc-800 py-3">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-box-archive text-secondary text-2xl"></i>
          <h2 class="text-xl md:text-3xl font-bold text-secondary">Archive Table</h2>
        </div>
        <a href="order.html" class="text-primary bg-secondary py-2 px-4 rounded-lg hover:bg-dark transition hover:text-secondary">
          <i class="fa-solid fa-arrow-left mr-1"></i> Back to My Orders
        </a>
      </div>

      <div class="w-full overflow-x-auto border border-zinc-800 bg-zinc-900/40 backdrop-blur-sm shadow-xl rounded-xl">
        <table class="w-full text-left border-collapse min-w-[600px]">
          <thead>
            <tr class="border-b text-primary border-zinc-800 bg-secondary text-zinc-400 text-xs uppercase tracking-wider font-mono">
              <th class="p-4 w-1/2">Archived Items / Description</th>
              <th class="p-4 w-1/4">Reference Number</th>
              <th class="p-4 w-1/4 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="archived-history-list" class="divide-y divide-zinc-800/60 text-sm">
            </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="history-receipt-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-[100] hidden">
    <div class="bg-zinc-950 border border-zinc-800 p-6 rounded-xl max-w-md w-full text-zinc-100 shadow-2xl mx-4 text-center relative max-h-[90vh] flex flex-col justify-between">
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-orange-400"></div>
      <div id="history-receipt-content" class="overflow-y-auto pr-1.5 text-left font-mono text-sm space-y-5 custom-scrollbar"></div>
      <button type="button" onclick="closeHistoryReceipt()" class="w-full mt-5 bg-zinc-800 text-white font-bold py-3 rounded text-xs uppercase tracking-widest transition hover:bg-zinc-700 hover:cursor-pointer">
        Close Preview
      </button>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-[200] space-y-3 pointer-events-none"></div>
  <div id="cart-container"></div>

  <script type="module" src="./src/main.js"></script>
  <script src="./src/archive-list.js"></script>
</body>
</html>
