<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <title>Computer Grid (GPU)</title>
</head>
<body class="body-container">
  <div id="nav-container">
    </div>

    <div id="main-layout">
<section id="product-item-navigation" class="mt-10">
   <div class="container-1">
      
      <div class="prod-container relative overflow-hidden px-1.5">
<div class="absolute right-0 top-0 h-full w-20 bg-linear-to-l from-primary/50 to-transparent z-10 pointer-events-none"></div>
         <ul id="product-nav-item" class="product-navigation-slides flex gap-2 transition-transform duration-500 ease-in-out">

            <!--product-card(support-card) will be dynamically inserted here (product-nav-items.js)--> 
     
      </ul>

<button class="prod-prev absolute bg-dark/70 rounded-4xl px-4 left-2 top-1/2 -translate-y-1/2 py-2 text-secondary text-xl hover:cursor-pointer hover:bg-primary duration-300">
<i class="fa-solid fa-chevron-left text-xl"></i> 
</button>

<button class="prod-next absolute bg-dark/70 rounded-4xl  right-2 top-1/2 -translate-y-1/2 py-2 px-4 text-secondary text-xl hover:cursor-pointer hover:bg-primary duration-300 ">
   <i class="fa-solid fa-chevron-right text-xl"></i> 
</button>

      </div>
   </div>
</section>

<section id="gpu-product" class=" my-20">
  
   <div class="container-1">
        <div class="md:flex justify-between gap-2 mb-10">
    <div>
      <h1 class="text-center text-3xl font-bold my-5 md:text-start">GPU</h1>
   <p class="text-center text-lg text-gray-600 mb-5">Discover our range of high-quality GPUs </p>
</div>

<div class="md:flex md:flex-row-reverse md:justify-between items-center px-4">

  <div class="w-full md:max-w-xl my-8">
    <div class="relative">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search..." 
        class="w-full md:w-100 p-4 pl-10 text-sm border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500"
      >
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
    </div>
  </div>
  </div>
    </div>

      <div id="gpu-container" class="my-20 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
         <!--product-card(support-card) will be dynamically inserted here (main-highlights.js)--> 
</div>
   </div>
</section>

</body>
<footer id="footer">
</footer>
</div>

<div id="cart-container"></div>
<script type="module" src="/src/main.js"></script>
</html>
