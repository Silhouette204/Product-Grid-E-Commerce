<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <title>Forgot Password - Computer Grid</title>
</head>
<body class="bg-dark">

  <div class="min-h-screen flex items-center justify-center p-4 font-poppins">
    <div class="bg-primary w-full max-w-xl grid grid-cols-1 md:grid-cols-5 rounded-2xl shadow-2xl overflow-hidden min-h-137.5 relative">

      <div class="col-span-1 md:col-span-5 p-8 md:p-12 flex flex-col justify-center bg-white text-zinc-900 transition-all duration-500 relative">
        
        <a href="index.html" id="exit-auth-btn" class="absolute top-5 right-5 text-zinc-400 hover:text-zinc-950 bg-zinc-100 hover:bg-zinc-200 w-8 h-8 rounded-full flex items-center justify-center transition duration-200 z-50 shadow-sm" title="Return to Main Page">
          <i class="fa-solid fa-xmark text-sm"></i>
        </a>

        <div id="form-box-signin" class="space-y-5">
          <div>
            <div class="flex flex-col gap-6 mb-10 items-center justify-center">
              <i class="fa-solid fa-lock text-6xl"></i>
              <h1 class="text-4xl text-center font-semibold">Forgot<br>Password</h1>
            </div>

            <form id="forgot-form" class="space-y-4">
             
              <div class="relative">
                <i class="fa-regular fa-envelope absolute left-3 top-3.5 text-zinc-400 text-sm"></i>
                <input type="email" id="forgot-email" placeholder="Email Address" required class="w-full bg-zinc-50 border border-zinc-200 p-2.5 pl-10 rounded-lg text-sm text-zinc-900 focus:outline-none focus:border-light focus:ring-1 focus:ring-light transition">
              </div>

              <div class="flex flex-row items-center justify-between mt-10">
                <div>
                  <button type="submit" class="w-fit bg-secondary hover:bg-light text-primary font-bold py-2.5 px-5 rounded-full transition duration-300 uppercase text-xs shadow-md shadow-secondary whitespace-nowrap">
                     Reset Password
                  </button>
                </div>

                <div class="flex flex-col">
                  <div class="text-right my-2">
                    <p class="text-xs text-zinc-500 ml-10 md:ml-0">Already have an account? <a href="sign-in.html" id="mobile-to-signin" class="text-xs text-secondary font-bold hover:underline">Sign In here</a></p>
                  </div> 
                  <div class="text-right my-2">
                    <p class="text-xs text-zinc-500 ml-10 md:ml-0">New user here? <a href="sign-up.html" id="mobile-to-signup" class="text-xs text-secondary font-bold hover:underline">Create an account</a></p>
                  </div> 
                </div>   
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
